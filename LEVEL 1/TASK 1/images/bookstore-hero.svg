<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f6ecd9"/>
  <ellipse cx="300" cy="360" rx="220" ry="18" fill="#e3d3ae"/>

  <!-- Bookshelf -->
  <rect x="60" y="60" width="480" height="260" rx="6" fill="#7a4b2e"/>
  <rect x="80" y="80" width="440" height="220" fill="#5c3620"/>

  <!-- Books row 1 -->
  <g>
    <rect x="100" y="100" width="34" height="120" fill="#c0392b"/>
    <rect x="138" y="95" width="30" height="125" fill="#2e7d67"/>
    <rect x="172" y="105" width="26" height="115" fill="#e0a336"/>
    <rect x="202" y="92" width="34" height="128" fill="#34495e"/>
    <rect x="240" y="100" width="28" height="120" fill="#a45c2e"/>
    <rect x="272" y="98" width="30" height="122" fill="#7d3c98"/>
    <rect x="306" y="102" width="26" height="118" fill="#c0392b"/>
    <rect x="336" y="94" width="34" height="126" fill="#1b6f78"/>
    <rect x="374" y="100" width="28" height="120" fill="#e0a336"/>
    <rect x="406" y="96" width="30" height="124" fill="#2e7d67"/>
    <rect x="440" y="104" width="26" height="116" fill="#34495e"/>
    <rect x="470" y="98" width="34" height="122" fill="#a45c2e"/>
  </g>

  <!-- Shelf divider -->
  <rect x="80" y="220" width="440" height="10" fill="#3e2414"/>

  <!-- Books row 2 lying flat with open book on top -->
  <rect x="120" y="250" width="180" height="20" fill="#8b5a2b"/>
  <rect x="120" y="270" width="180" height="20" fill="#a9702f"/>

  <!-- Open book -->
  <g transform="translate(330,235)">
    <path d="M0 40 L60 20 L60 70 L0 90 Z" fill="#fdf6e3"/>
    <path d="M120 40 L60 20 L60 70 L120 90 Z" fill="#f5ecd0"/>
    <line x1="60" y1="20" x2="60" y2="70" stroke="#c9b78c" stroke-width="2"/>
  </g>

  <!-- Title plaque -->
  <rect x="200" y="330" width="200" height="8" rx="4" fill="#c9a45c"/>
</svg>
