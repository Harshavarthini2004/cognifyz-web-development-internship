    <rect x="-140" y="-18" width="280" height="36" rx="8" fill="#ff5c3a"/>
    <rect x="-170" y="-40" width="34" height="80" rx="8" fill="#f2f2f2"/>
    <rect x="136" y="-40" width="34" height="80" rx="8" fill="#f2f2f2"/>
    <rect x="-190" y="-55" width="18" height="110" rx="6" fill="#c9c9c9"/>
    <rect x="172" y="-55" width="18" height="110" rx="6" fill="#c9c9c9"/>
  </g>

  <!-- Pulse line -->
  <polyline points="330,150 380,150 400,90 430,210 460,60 490,150 560,150"
            fill="none" stroke="#ff5c3a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
