<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="320" fill="#111111"/>

  <!-- Camera body -->
  <rect x="180" y="120" width="240" height="140" rx="16" fill="#2b2b2b"/>
  <rect x="180" y="120" width="240" height="30" rx="10" fill="#1a1a1a"/>

  <!-- Viewfinder bump -->
  <rect x="260" y="90" width="80" height="40" rx="8" fill="#1a1a1a"/>

  <!-- Lens -->
  <circle cx="300" cy="200" r="55" fill="#050505" stroke="#444" stroke-width="6"/>
  <circle cx="300" cy="200" r="35" fill="#1c1c1c" stroke="#666" stroke-width="4"/>
  <circle cx="300" cy="200" r="16" fill="#3a75c4"/>

  <!-- Flash -->
  <rect x="200" y="135" width="30" height="20" rx="4" fill="#e8e8e8"/>

  <!-- Shutter button -->
  <circle cx="400" cy="105" r="10" fill="#e05a3c"/>
</svg>
